<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambridge English: Movers - Writing Skills Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            margin: 0;
            padding: 20px;
            color: #1e293b;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            padding: 40px;
            border: 5px solid #bae6fd;
        }

        h1 {
            text-align: center;
            color: #0284c7;
            font-size: 2.3rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 35px;
            font-size: 1.1rem;
        }

        /* Menu điều hướng */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 35px;
        }

        .menu-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: #475569;
        }

        .menu-btn:hover, .menu-btn.active {
            background: #0284c7;
            color: white;
            border-color: #0369a1;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .content-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .section-header {
            color: #0c4a6e;
            font-size: 1.6rem;
            border-bottom: 4px dashed #bae6fd;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .task-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0369a1;
            margin: 25px 0 12px 0;
            background: #f0f9ff;
            padding: 8px 15px;
            border-radius: 8px;
            border-left: 5px solid #38bdf8;
        }

        /* Tranh và Kéo thả Số chương 2 */
        .img-wrap {
            text-align: center;
            margin: 20px 0;
            background: #f8fafc;
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed #cbd5e1;
            position: relative;
        }

        .img-wrap img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .interactive-map {
            position: relative;
            display: inline-block;
        }

        .drop-dot {
            position: absolute;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0284c7;
            cursor: pointer;
            z-index: 10;
        }

        .number-pool {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }

        .drag-number {
            width: 32px;
            height: 32px;
            background: #0284c7;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: grab;
        }

        /* Question Block & Các loại Input */
        .question-block {
            background: #fafafa;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .flex-wrap-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            padding: 6px 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-weight: 700;
            color: #334155;
            background: white;
        }
        .input-mini { width: 60px; text-align: center; }
        .input-short { width: 150px; text-align: center; }
        .input-medium { width: 250px; }
        .input-long { width: 100%; max-width: 650px; }
        .textarea-large { width: 100%; max-width: 650px; height: 80px; font-family: 'Quicksand', sans-serif; padding: 10px; border-radius: 8px; border: 2px solid #cbd5e1; font-weight: 700; }

        /* Nút chọn 3 trạng thái (Trống -> V -> X) */
        .tri-state-btn {
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tri-state-btn.state-v { background: #dcfce7; border-color: #22c55e; color: #15803d; }
        .tri-state-btn.state-x { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

        /* Nút lựa chọn Radio rành mạch */
        .radio-group-btn {
            display: inline-flex;
            gap: 5px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
        }
        .radio-option {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .radio-option.selected {
            background: #0284c7;
            color: white;
            border-color: #0369a1;
        }

        /* 2 Cột Matching */
        .matching-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 20px;
        }
        .match-card {
            background: white;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Bảng chọn thuộc tính chương 8 */
        .attribute-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .attribute-table th, .attribute-table td {
            border: 1px solid #cbd5e1;
            padding: 12px;
            text-align: center;
        }
        .attribute-table th { background: #f0f9ff; color: #0369a1; }
        .tag-pool-cell {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .clickable-tag {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
        }
        .clickable-tag.active-tag {
            background: #38bdf8;
            color: white;
            border-color: #0284c7;
        }

        /* Bảng Điểm Tổng Hợp Cuối Trang */
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 40px;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        .summary-table th, .summary-table td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .summary-table th { background: #0284c7; color: white; font-size: 1.05rem; }
        .summary-table tr:last-child { background: #f8fafc; font-weight: 700; font-size: 1.1rem; }
        .status-badge { background: #e2e8f0; color: #475569; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; }
        .status-badge.done { background: #dcfce7; color: #15803d; }

        /* Trạng thái chấm đúng/sai */
        .correct-bg { border-color: #22c55e !important; background-color: #f0fdf4 !important; color: #166534; }
        .incorrect-bg { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #991b1b; }

        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
